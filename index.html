<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crystamber</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='white' stroke='black' stroke-width='5'/><path d='M 4 50 A 46 46 0 0 1 96 50 Z' fill='%23ee1515' stroke='black' stroke-width='5'/><rect x='4' y='47' width='92' height='6' fill='black'/><circle cx='50' cy='50' r='13' fill='white' stroke='black' stroke-width='5'/><circle cx='50' cy='50' r='5' fill='white' stroke='black' stroke-width='3'/></svg>" />
<style>
  :root {
    --bg: #0f0f1e;
    --bg-2: #1a1a2e;
    --surface: #232342;
    --surface-2: #2d2d52;
    --border: #3a3a5c;
    --text: #e8e8f0;
    --text-dim: #9090a8;
    --accent: #ffcb05;
    --accent-2: #3b4cca;
    --success: #4ade80;
    --warn: #fbbf24;
    --danger: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, #232342 0%, #1a1a2e 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 4px;
    background: linear-gradient(90deg, var(--accent), #ff6b35);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-bottom: 16px;
  }

  /* Set tabs */
  .set-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .set-tab {
    background: var(--surface);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 7px 18px;
    border-radius: 8px;
    font-size: 0.88rem;
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
    transition: all 0.15s ease;
  }

  .set-tab:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .set-tab.active {
    background: var(--accent-2);
    color: #fff;
    border-color: var(--accent-2);
    font-weight: 600;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .progress-text {
    font-size: 1.1rem;
    font-weight: 600;
    min-width: 200px;
  }

  .progress-text .count { color: var(--accent); font-size: 1.4rem; }

  .progress-bar {
    flex: 1;
    min-width: 200px;
    height: 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    transition: width 0.4s ease;
    border-radius: 999px;
  }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }

  .filter-btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s ease;
  }

  .filter-btn:hover {
    background: var(--surface-2);
    border-color: var(--accent);
  }

  .filter-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 600;
  }

  /* Card Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    position: relative;
    user-select: none;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 6px 20px rgba(255, 203, 5, 0.2);
  }

  .card.owned {
    border-color: var(--success);
    box-shadow: 0 0 0 1px var(--success), 0 4px 16px rgba(74, 222, 128, 0.25);
  }

  .card-image-wrap {
    aspect-ratio: 245 / 342;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  .card-image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: filter 0.25s ease, opacity 0.25s ease;
  }

  .card:not(.owned) .card-image-wrap img {
    filter: grayscale(0.85) brightness(0.55);
  }

  .placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    width: 100%;
    height: 100%;
    background:
      repeating-linear-gradient(
        45deg,
        #1a1a2e,
        #1a1a2e 8px,
        #232342 8px,
        #232342 16px
      );
    color: var(--text-dim);
    font-weight: 700;
    font-size: 2rem;
    gap: 4px;
  }
  .placeholder .ph-num { font-size: 2.4rem; color: var(--accent); }
  .placeholder .ph-label {
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .num-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.75);
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    z-index: 2;
    backdrop-filter: blur(4px);
  }

  .check-overlay {
    position: absolute;
    bottom: 8px;
    right: 8px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--success);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0f0f1e;
    font-weight: 900;
    font-size: 1.1rem;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.2s ease;
    z-index: 2;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .card.owned .check-overlay {
    opacity: 1;
    transform: scale(1);
  }

  .card-info {
    padding: 8px 10px 10px;
  }

  .card-name {
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .card:not(.owned) .card-name {
    color: var(--text-dim);
  }

  .card-meta {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .card-date {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.7rem;
    color: var(--success);
    background: rgba(74, 222, 128, 0.1);
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s ease;
    line-height: 1.3;
  }
  .card-date:hover { background: rgba(74, 222, 128, 0.22); }
  .card-date input[type="date"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--success);
    border-radius: 4px;
    font-size: 0.7rem;
    padding: 1px 4px;
    font-family: inherit;
    outline: none;
    color-scheme: dark;
  }
  .card:not(.owned) .card-date { display: none; }

  .card-condition {
    display: inline-block;
    margin-top: 6px;
    margin-left: 6px;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    transition: filter 0.15s ease;
    line-height: 1.3;
    vertical-align: top;
  }
  .card-condition:hover { filter: brightness(1.18); }
  .card-condition.unset {
    background: rgba(144, 144, 168, 0.15);
    color: var(--text-dim);
    font-weight: 400;
  }
  .card-condition.cond-M,
  .card-condition.cond-NM   { background: rgba(74, 222, 128, 0.16); color: #4ade80; }
  .card-condition.cond-LP   { background: rgba(255, 203, 5, 0.18);  color: #ffcb05; }
  .card-condition.cond-MP   { background: rgba(251, 146, 60, 0.18); color: #fb923c; }
  .card-condition.cond-HP   { background: rgba(239, 68, 68, 0.20);  color: #ef4444; }
  .card-condition.cond-DMG  { background: rgba(220, 38, 38, 0.30);  color: #fca5a5; }
  .card-condition.cond-graded {
    background: rgba(96, 165, 250, 0.18);
    color: #60a5fa;
  }
  .card-condition select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.7rem;
    padding: 1px 4px;
    font-family: inherit;
    outline: none;
  }
  .card:not(.owned) .card-condition { display: none; }

  .card-price {
    display: inline-block;
    margin-top: 6px;
    margin-left: 6px;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    transition: filter 0.15s ease;
    line-height: 1.3;
    vertical-align: top;
    background: rgba(255, 203, 5, 0.15);
    color: var(--accent);
  }
  .card-price:hover { filter: brightness(1.18); }
  .card-price.unset {
    background: rgba(144, 144, 168, 0.15);
    color: var(--text-dim);
    font-weight: 400;
  }
  .card-price input[type="number"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--accent);
    border-radius: 4px;
    font-size: 0.7rem;
    padding: 1px 4px;
    font-family: inherit;
    outline: none;
    width: 100px;
    -moz-appearance: textfield;
  }
  .card-price input[type="number"]::-webkit-outer-spin-button,
  .card-price input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .card:not(.owned) .card-price { display: none; }

  .card-cta {
    display: inline-block;
    margin-top: 8px;
    font-size: 0.72rem;
    padding: 4px 12px;
    border-radius: 6px;
    background: rgba(144, 144, 168, 0.06);
    color: var(--text-dim);
    border: 1px dashed rgba(144, 144, 168, 0.35);
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: all 0.2s ease;
    pointer-events: none;
  }
  .card:hover .card-cta {
    background: rgba(255, 203, 5, 0.10);
    color: var(--accent);
    border-color: rgba(255, 203, 5, 0.45);
    border-style: solid;
  }
  .card.owned .card-cta { display: none; }

  .spend-stat {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 6px;
  }
  .spend-stat b { color: var(--accent); font-weight: 600; }
  .spend-stat:empty { display: none; }

  .sort-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .sort-row label {
    color: var(--text-dim);
    font-size: 0.85rem;
  }
  .sort-row select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  .sort-row select:hover { border-color: var(--accent); }
  .sort-row select:focus { outline: none; border-color: var(--accent); }
  .card-edition {
    display: inline-block;
    margin-top: 6px;
    margin-left: 6px;
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    transition: filter 0.15s ease;
    line-height: 1.3;
    vertical-align: top;
    background: rgba(96, 165, 250, 0.16);
    color: #60a5fa;
  }
  .card-edition:hover { filter: brightness(1.18); }
  .card-edition.unset {
    background: rgba(144, 144, 168, 0.15);
    color: var(--text-dim);
    font-weight: 400;
  }
  .card-edition select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 0.7rem;
    padding: 1px 4px;
    font-family: inherit;
    outline: none;
  }
  .card:not(.owned) .card-edition { display: none; }
  .latest-pickup {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-left: auto;
  }
  .latest-pickup b {
    color: var(--accent);
    font-weight: 600;
  }

  .time-stat {
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-top: 12px;
  }
  .time-stat b { color: var(--accent); font-weight: 600; }
  .time-stat.complete {
    color: var(--success);
    font-weight: 600;
    font-size: 0.95rem;
  }
  .time-stat.complete b { color: var(--accent); }
  .time-stat:empty { display: none; }

  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }

  footer {
    margin-top: 32px;
    padding: 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
  }
  footer code {
    background: var(--surface);
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--accent);
    font-size: 0.75rem;
  }

  @media (max-width: 600px) {
    .container { padding: 16px 12px 40px; }
    h1 { font-size: 1.4rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .card-name { font-size: 0.75rem; }
  }

  #undoToast {
    display: none;
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    align-items: center;
    gap: 14px;
    z-index: 9999;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    font-size: 0.875rem;
    color: var(--text);
    white-space: nowrap;
  }
  #undoToast.visible { display: flex; }
  #undoToast button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  #undoToast button:hover { opacity: 0.85; }

  /* Sync banner. The old signal was a title tooltip on an 8px dot in the footer,
     which is invisible on a phone [no hover, and you never scroll that far]. That
     is how a two-week outage went unnoticed. This sits at the top, is unmissable,
     and only appears when something is actually wrong. */
  #syncBanner {
    display: none;
    position: sticky;
    top: 0;
    z-index: 900;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.45;
    font-weight: 600;
    text-align: left;
    color: #1a1a2e;
    background: var(--warn);
  }
  #syncBanner.show { display: block; }
  #syncBanner.bad  { background: var(--danger); }
  /* Export has to be reachable without scrolling past 102 cards. Burying the
     sync signal in the footer is what hid this outage for two weeks; burying the
     way to rescue your data down there would be the same mistake twice. */
  .header-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .header-tools { flex: 0 0 auto; }
  .header-tools button {
    background: transparent;
    border: 1px solid var(--text-dim);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 6px 12px;
    margin-left: 6px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    min-height: 34px;          /* comfortable tap target on a phone */
  }
  .header-tools button:hover { color: var(--success); border-color: var(--success); }

  #syncBanner .banner-action {
    display: inline-block;
    margin-top: 6px;
    padding: 5px 11px;
    border: 1px solid rgba(26,26,46,0.55);
    border-radius: 6px;
    background: rgba(255,255,255,0.35);
    color: #1a1a2e;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .footer-tools { display: inline-block; margin-left: 10px; }
  .footer-tools button {
    background: transparent;
    border: 1px solid var(--text-dim);
    color: var(--text-dim);
    border-radius: 5px;
    padding: 3px 9px;
    margin-left: 5px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
  }
  .footer-tools button:hover { color: var(--success); border-color: var(--success); }

  #syncBanner .detail {
    display: block;
    font-weight: 400;
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
    word-break: break-word;
  }
</style>
</head>
<body>
<div id="syncBanner"></div>
<div id="undoToast">
  <span id="undoToastMsg">Card removed from collection</span>
  <button onclick="undoRemove()">Undo</button>
</div>
<div class="container">

  <header>
    <div class="header-top">
      <h1 id="setTitle">Base</h1>
      <span class="header-tools">
        <button type="button" onclick="exportCollection()">Export backup</button>
        <button type="button" onclick="document.getElementById('importFile').click()">Import</button>
      </span>
    </div>
    <div class="subtitle" id="setSubtitle">Crystamber · Pokemon TCG Collection Tracker · 102 cards</div>

    <div class="set-tabs" id="setTabs">
      <button class="set-tab active" data-set="base">Base</button>
      <button class="set-tab" data-set="jungle">Jungle</button>
      <button class="set-tab" data-set="fossil">Fossil</button>
      <button class="set-tab" data-set="teamrocket">Team Rocket</button>
      <button class="set-tab" data-set="gymheroes">Gym Heroes</button>
      <button class="set-tab" data-set="gymchallenge">Gym Challenge</button>
      <button class="set-tab" data-set="neogenesis">Neo Genesis</button>
    </div>

    <div class="progress-row">
      <div class="progress-text">
        <span class="count" id="ownedCount">0</span> / <span id="totalCount">102</span> collected
        <span id="ownedPct" style="color: var(--text-dim); font-size: 0.9rem; margin-left: 6px;"></span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
      </div>
    </div>

    <div class="time-stat" id="timeStat"></div>
    <div class="spend-stat" id="spendStat"></div>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="owned">Owned</button>
      <button class="filter-btn" data-filter="missing">Missing</button>
      <button class="filter-btn" data-filter="Holo Rare">Holo Rare</button>
      <button class="filter-btn" data-filter="Rare">Rare</button>
      <button class="filter-btn" data-filter="Uncommon">Uncommon</button>
      <button class="filter-btn" data-filter="Common">Common</button>
    </div>

    <div class="sort-row">
      <label for="sortSelect">Sort:</label>
      <select id="sortSelect">
        <option value="card">Card #</option>
        <option value="dex" selected>Pokedex #</option>
        <option value="recent">Recently added</option>
        <option value="oldest">Oldest first</option>
      </select>
      <span class="latest-pickup" id="latestPickup"></span>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    <span id="serverDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text-dim);margin-right:6px;vertical-align:middle;" title="Connecting to cloud..."></span>
    Progress saves automatically in your browser.
    <span class="footer-tools">
      <button type="button" onclick="exportCollection()">Export backup</button>
      <button type="button" onclick="document.getElementById('importFile').click()">Import</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none"
             onchange="if(this.files[0]){importCollection(this.files[0]);this.value='';}">
    </span>
  </footer>
</div>

<script>
  // ─── SET DEFINITIONS ─────────────────────────────────────────────────────────

  const BASE_CARDS = [
    { num: 1,   name: "Alakazam",               rarity: "Holo Rare", cardType: "Pokemon", dex: 65  },
    { num: 2,   name: "Blastoise",               rarity: "Holo Rare", cardType: "Pokemon", dex: 9   },
    { num: 3,   name: "Chansey",                 rarity: "Holo Rare", cardType: "Pokemon", dex: 113 },
    { num: 4,   name: "Charizard",               rarity: "Holo Rare", cardType: "Pokemon", dex: 6   },

  // ─── SUPABASE SYNC ───────────────────────────────────────────────────────────
  // One row per (collection, set) in collection_sets. Editing Jungle writes only
  // the Jungle row, so a bad write can no longer take other sets down with it.
  const SUPABASE_URL = 'https://guyrhkzmogqcnemwyilx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_vwBr1SsV84I964WDAetFzA_Ow4p6e2L';
  const COLLECTION_ID = 'crystamber';
  const REV_KEY = 'crystamberRevs_v1';   // { setId: rev } — highest rev this device has seen

    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;

  // Nothing may be pushed until the first read resolves — before that this device
  // does not know what the cloud holds, and guessing is how sets get clobbered.
  let cloudReady = false;
  const pendingSets = new Set();
  let syncError = null;
  let flushTimer = null;
  let backoff = 1000;

  function localRevs() { return loadJSON(REV_KEY); }

  function setLocalRev(setId, rev) {
    const revs = localRevs();

  // Always read straight from localStorage rather than the live in-memory objects,
  // so a queued set that is no longer active still pushes its own data.
  function setPayload(setId) {
    const s = SETS[setId];
    return {
      collection_id: COLLECTION_ID,
      set_id:        setId,
      owned:         loadOwned(s.storageKey),
      conditions:    loadJSON(s.condKey),
      prices:        loadJSON(s.priceKey),

  function writeSetLocal(setId, d) {
    const s = SETS[setId];
    localStorage.setItem(s.storageKey,  JSON.stringify(d.owned         || {}));
    localStorage.setItem(s.condKey,     JSON.stringify(d.conditions    || {}));
    localStorage.setItem(s.priceKey,    JSON.stringify(d.prices        || {}));
    localStorage.setItem(s.editionsKey, JSON.stringify(d.card_editions || {}));

  // Used on first contact for a set, and on reconnect when both sides moved while
  // the backend was unreachable. A card owned on either side is owned, so nothing
  // gets dropped; the earlier acquisition date wins because that is the true one.
  // Local wins a metadata clash — it is the side holding the unsent edits.
  function unionMerge(local, cloud) {
    const owned = Object.assign({}, cloud.owned || {});
    for (const num in local.owned) {
      const mine = local.owned[num], theirs = owned[num];
      if (theirs == null || (mine && mine < theirs)) owned[num] = mine;
    }
    return {
      owned,
      conditions:    Object.assign({}, cloud.conditions    || {}, local.conditions),
      prices:        Object.assign({}, cloud.prices        || {}, local.prices),
      card_editions: Object.assign({}, cloud.card_editions || {}, local.card_editions),
    };
  }

  // ─── LOCAL EXPORT / IMPORT ───────────────────────────────────────────────────
  // Cloud sync was the only way state ever left a device, so whenever Supabase is
  // down the newest copy of the collection lives in exactly one browser's
  // localStorage with no way to get it out. Clearing site data on that phone would
  // have ended it. These two work with the backend dead, which is the entire point.
  //
  // Shape matches backup_crystamber_*.json: { setId: { owned, conditions, prices,
  // cardEditions } }, so old backups import without conversion.
  async function exportCollection() {
    const out = {};
    for (const id in SETS) {
      const s = SETS[id];
      out[id] = {
        owned:        loadOwned(s.storageKey),
        conditions:   loadJSON(s.condKey),
        prices:       loadJSON(s.priceKey),
        cardEditions: loadJSON(s.editionsKey),
      };
    }
    const text = JSON.stringify(out, null, 2);
    const name = `backup_crystamber_${todayISO()}.json`;

    // A blob download is unreliable on a phone — iOS Safari often just opens the
    // JSON in a tab, which is not a saved file. The share sheet is the native
    // route out of a phone: AirDrop, Files, mail it to yourself. Desktop and any
    // browser without file sharing fall through to the ordinary download.
    try {
      const file = new File([text], name, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: name });
        return;
      }
    } catch (err) {
      // AbortError means the user dismissed the sheet — that is a choice, not a
      // failure, so do not fall through and fire a surprise download at them.
      if (err && err.name === 'AbortError') return;
    }

    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  // Union, never replace. Importing an older backup must not delete cards this
  // device has picked up since — the merge only ever adds.
  function importCollection(file) {
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try { data = JSON.parse(reader.result); }
      catch (_) { alert('That file is not valid JSON.'); return; }
      if (!data || typeof data !== 'object') { alert('That file is not a Crystamber backup.'); return; }

      const touched = [];
      for (const id in data) {
        if (!SETS[id]) continue;
        const incoming = data[id] || {};
        // This device is passed as the winning side, so an old backup can fill
        // gaps but can never overwrite a condition or price set since it was
        // taken. Owned dates resolve to the earlier one regardless of side.
        const merged = unionMerge(
          setPayload(id),
          { owned:      incoming.owned        || {},
            conditions: incoming.conditions   || {},
            prices:     incoming.prices       || {},
            card_editions: incoming.cardEditions || incoming.card_editions || {} }
        );
        writeSetLocal(id, merged);
        touched.push(id);
        if (sb) pendingSets.add(id);
      }
      if (!touched.length) { alert('No recognised sets in that file.'); return; }

      loadSetState(activeSetId);
      updateProgress();
      render();
      if (sb && cloudReady && pendingSets.size) scheduleFlush(0);
      refreshStatus();
      alert(`Imported ${touched.length} set(s): ${touched.join(', ')}. Nothing was removed.`);
    };
    reader.readAsText(file);
  }

  function queueSet(setId) {
    pendingSets.add(setId);
    scheduleFlush(0);
    refreshStatus();
  }

  function scheduleFlush(delay) {
    if (flushTimer) return;
    flushTimer = setTimeout(() => { flushTimer = null; flush(); }, delay);
  }

  async function flush() {
    if (!sb || !cloudReady || !pendingSets.size) { refreshStatus(); return; }
    const batch = [...pendingSets];
    try {
      const { data, error } = await sb
        .from('collection_sets')
        .upsert(batch.map(setPayload), { onConflict: 'collection_id,set_id' })
        .select('set_id, rev');
      if (error) throw error;
      batch.forEach(id => pendingSets.delete(id));
      (data || []).forEach(r => setLocalRev(r.set_id, r.rev));
      syncError = null;
      backoff = 1000;
    } catch (err) {
      // Keep the batch queued and actually come back for it.
      syncError = err;
      backoff = Math.min(backoff * 2, 30000);
      scheduleFlush(backoff);
    }
    refreshStatus();
  }

        const today = todayISO();

  // The dot tells the truth: grey = not connected yet, amber = unsaved work in
  // flight, red = writes are failing and how many sets are stranded.
  //
  // The dot alone was not enough. Its only detail was a title tooltip, which a
  // phone cannot show, sitting in the footer below the whole grid — so a dead
  // backend looked identical to a healthy one on the device most edits happen on.
  // refreshStatus now also drives a banner at the top of the page for the two
  // states that mean "your edits are not leaving this device": a hard sync error,
  // and a first read that never lands.
  const CONNECT_STALL_MS = 8000;
  const bootedAt = Date.now();
  let stallTimer = setTimeout(refreshStatus, CONNECT_STALL_MS + 250);

  function refreshStatus() {
    const el = document.getElementById('serverDot');
    const banner = document.getElementById('syncBanner');
    let color, title, alert = null, severe = false;

    if (!sb) {
      color = 'var(--danger)';
      title = 'No cloud sync - the Supabase library failed to load. Changes are local to this browser only.';
      alert = ['Not syncing - this device only.',
               'The sync library failed to load. Your edits are saved in this browser but will not reach your other devices.'];
      severe = true;
    } else if (syncError) {
      const msg = (syncError && syncError.message) ? syncError.message : String(syncError);
      const names = [...pendingSets];
      color = 'var(--danger)';
      title = `Sync failing - ${pendingSets.size} set(s) not saved to cloud [${names.join(', ')}]. ${msg}. Retrying.`;
      alert = [names.length
                 ? `Not syncing - ${names.length} set(s) unsaved: ${names.join(', ')}.`
                 : 'Not syncing - cannot reach the cloud.',
               `Your edits are saved on this device only. Do not edit on another device until this clears. ${msg}. Retrying automatically.`];
      severe = true;
    } else if (!cloudReady) {
      color = 'var(--text-dim)';
      title = 'Connecting to cloud...';
      if (Date.now() - bootedAt > CONNECT_STALL_MS) {
        alert = ['Still connecting - not synced yet.',
                 'The first read has not landed. Anything you change now is saved on this device only until it does.'];
      }
    } else if (pendingSets.size) {
      color = 'var(--warn)';
      title = `Saving ${pendingSets.size} set(s)...`;
    } else {
      color = 'var(--success)';
      title = 'Cloud sync active - every set saved';
    }

    if (el) { el.style.background = color; el.title = title; }

    if (banner) {
      if (alert) {
        banner.innerHTML = '';
        banner.appendChild(document.createTextNode(alert[0]));
        const d = document.createElement('span');
        d.className = 'detail';
        d.textContent = alert[1];
        banner.appendChild(d);
        // When sync is genuinely down, the banner carries the escape hatch itself.
        // Telling someone their data is stranded is only half a warning if the way
        // to get it off the device is somewhere else on the page.
        if (severe) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'banner-action';
          b.textContent = 'Export backup now';
          b.onclick = exportCollection;
          banner.appendChild(b);
        }
        banner.classList.add('show');
        banner.classList.toggle('bad', severe);
      } else {
        banner.classList.remove('show', 'bad');
      }
    }

    // Keep re-checking while the first read is still outstanding, so the stall
    // banner appears on its own rather than waiting for the next user action.
    clearTimeout(stallTimer);
    if (sb && !cloudReady && !syncError) stallTimer = setTimeout(refreshStatus, 2000);
  }

  // ─── UTILITIES ────────────────────────────────────────────────────────────────

  const pad = (n) => String(n).padStart(3, "0");

  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  function fmtDate(iso) {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  }

  function relTime(iso) {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const days = Math.round((today - d) / 86400000);
    if (days === 0) return "today";
    if (days === 1) return "yesterday";
    if (days < 7) return days + " days ago";
    if (days < 30) return Math.floor(days / 7) + "w ago";
    if (days < 365) return Math.floor(days / 30) + "mo ago";
    return Math.floor(days / 365) + "y ago";
  }

  function formatDuration(fromISO, toISO) {
    const from = new Date(fromISO + "T00:00:00");
    const to   = new Date(toISO   + "T00:00:00");
    const days = Math.max(0, Math.round((to - from) / 86400000));
    if (days === 0) return "less than a day";
    if (days === 1) return "1 day";
    if (days < 7)  return days + " days";
    if (days < 30) { const w = Math.floor(days/7); return w === 1 ? "1 week" : w + "w"; }
    if (days < 365){ const mo = Math.floor(days/30); return mo === 1 ? "1 month" : mo + "mo"; }
    const years = Math.floor(days/365);
    const remMo = Math.floor((days%365)/30);
    if (remMo === 0) return years === 1 ? "1 year" : years + "y";
    return `${years}y ${remMo}mo`;
  }

  const idrFmt = new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 });
  function fmtIDR(n) {
    if (n == null || isNaN(n)) return "";
    return idrFmt.format(n);
  }

  function condClass(value) {
    if (!value) return "unset";
    if (RAW_CONDS.includes(value)) return "cond-" + value;
    return "cond-graded";
  }

  function isOwned(num) {
    return Object.prototype.hasOwnProperty.call(owned, num);
  }

  function escapeAttr(s) {
    return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ─── UNDO ─────────────────────────────────────────────────────────────────────

  let undoState  = null;
  let undoTimer  = null;
  const undoToast = document.getElementById("undoToast");

  function showUndoToast(cardName) {
    document.getElementById("undoToastMsg").textContent = `"${cardName}" removed`;
    undoToast.classList.add("visible");
    if (undoTimer) clearTimeout(undoTimer);
    undoTimer = setTimeout(dismissUndo, 6000);
  }

  function dismissUndo() {
    undoToast.classList.remove("visible");
    undoState = null;
    undoTimer = null;
  }

  function undoRemove() {
    if (!undoState) return;
    const { num, date, condition, price, edition } = undoState;
    owned[num] = date;
    if (condition !== undefined) conditions[num] = condition;
    if (price !== undefined) prices[num] = price;
    if (edition !== undefined) cardEditions[num] = edition;
    save();
    if (condition !== undefined) saveConditions();
    if (price !== undefined) savePrices();
    if (edition !== undefined) saveCardEditions();
    undoToast.classList.remove("visible");
    if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
    undoState = null;
    replaceCardInDom(num);
    updateProgress();
    if (activeFilter === "owned" || activeFilter === "missing" || activeSort !== "card") render();
  }

  // ─── ACTIONS ─────────────────────────────────────────────────────────────────

  function toggle(num) {
    if (isOwned(num)) {
      const card = CARDS.find(c => c.num === num);
      undoState = {
        num,
        date:      owned[num],
        condition: conditions[num],
        price:     prices[num],
        edition:   cardEditions[num],
      };
      delete owned[num];
      if (conditions[num] !== undefined) { delete conditions[num]; saveConditions(); }
      if (prices[num] !== undefined) { delete prices[num]; savePrices(); }
      if (cardEditions[num] !== undefined) { delete cardEditions[num]; saveCardEditions(); }
      save();
      replaceCardInDom(num);
      updateProgress();
      if (activeFilter === "owned" || activeFilter === "missing" || activeSort !== "card") render();
      showUndoToast(card ? card.name : `#${num}`);
    } else {
      if (undoState && undoState.num === num) dismissUndo();
      owned[num] = todayISO();
      save();
      replaceCardInDom(num);
      updateProgress();
      if (activeFilter === "owned" || activeFilter === "missing" || activeSort !== "card") render();
    }
  }

  function setDate(num, iso) {
    if (!isOwned(num)) return;
    owned[num] = iso;
    save();
    replaceCardInDom(num);
    updateProgress();
    if (activeSort !== "card") render();
  }

  function setCondition(num, value) {
    if (!isOwned(num)) return;
    if (!value) delete conditions[num];
    else conditions[num] = value;
    saveConditions();
    replaceCardInDom(num);
  }

  function setPrice(num, value) {
    if (!isOwned(num)) return;
    if (value == null || value === "" || isNaN(value)) delete prices[num];
    else prices[num] = Number(value);
    savePrices();
    replaceCardInDom(num);
    updateProgress();
  }

  function setCardEdition(num, value) {
    if (!isOwned(num)) return;
    if (!value) delete cardEditions[num];
    else cardEditions[num] = value;
    saveCardEditions();
    replaceCardInDom(num);
  }

  // ─── SET SWITCHER ─────────────────────────────────────────────────────────────

  function switchSet(setId) {
    if (setId === activeSetId) return;
    activeSetId = setId;
    localStorage.setItem("activeSet", setId);
    loadSetState(setId);
    activeFilter = "all";
    activeSort = "dex";

    const s = SETS[setId];
    document.getElementById("setTitle").textContent = s.name;
    document.getElementById("setSubtitle").textContent = `Crystamber · Pokemon TCG Collection Tracker · ${s.cards.length} cards`;
    document.getElementById("totalCount").textContent = s.cards.length;

    document.querySelectorAll(".set-tab").forEach(b =>
      b.classList.toggle("active", b.dataset.set === setId)
    );
    document.querySelectorAll(".filter-btn").forEach(b =>
      b.classList.toggle("active", b.dataset.filter === "all")
    );
    sortSelect.value = "dex";

    updateProgress();
    render();
  }

  document.getElementById("setTabs").addEventListener("click", (e) => {
    const btn = e.target.closest(".set-tab");
    if (btn) switchSet(btn.dataset.set);
  });

  // ─── PROGRESS ────────────────────────────────────────────────────────────────

  function updateProgress() {
    const keys = Object.keys(owned);
    const n = keys.length;
    ownedCountEl.textContent = n;
    const pct = (n / CARDS.length) * 100;
    progressFill.style.width = pct + "%";
    ownedPctEl.textContent = `(${pct.toFixed(1)}%)`;

    if (n === 0) {
      latestPickupEl.textContent = "";
      timeStatEl.textContent = "";
      timeStatEl.className = "time-stat";
      spendStatEl.textContent = "";
      return;
    }

    let latestNum = null, latestDate = "", firstDate = "9999-99-99";
    for (const [num, date] of Object.entries(owned)) {
      if (date > latestDate) { latestDate = date; latestNum = +num; }
      if (date < firstDate) { firstDate = date; }
    }
    const latestCard = CARDS.find(c => c.num === latestNum);
    if (latestCard) {
      latestPickupEl.innerHTML = `Latest pickup: <b>${latestCard.name}</b> · ${relTime(latestDate)}`;
    }

    const isComplete = n === CARDS.length;
    if (isComplete) {
      timeStatEl.innerHTML = `Completed in <b>${formatDuration(firstDate, latestDate)}</b> · 🏆`;
      timeStatEl.className = "time-stat complete";
    } else {
      timeStatEl.innerHTML = `Collecting since <b>${fmtDate(firstDate)}</b> · ${formatDuration(firstDate, todayISO())} in`;
      timeStatEl.className = "time-stat";
    }

    const priceVals = Object.values(prices).filter(v => typeof v === "number" && !isNaN(v));
    const filled = priceVals.length;
    if (filled === 0) {
      spendStatEl.textContent = "";
    } else {
      const total = priceVals.reduce((a, b) => a + b, 0);
      const avg = total / filled;
      const note = filled < n ? ` <span style="opacity:0.6">(${filled} of ${n} priced)</span>` : "";
      let html = `Spent <b>${fmtIDR(total)}</b>`;
      if (filled > 1) html += ` · Avg <b>${fmtIDR(avg)}</b>`;
      spendStatEl.innerHTML = html + note;
    }
  }

  // ─── RENDER ───────────────────────────────────────────────────────────────────

  let activeFilter = "all";
  let activeSort = "dex";

  const grid            = document.getElementById("grid");
  const ownedCountEl    = document.getElementById("ownedCount");
  const ownedPctEl      = document.getElementById("ownedPct");
  const progressFill    = document.getElementById("progressFill");
  const filtersEl       = document.getElementById("filters");
  const sortSelect      = document.getElementById("sortSelect");
  const latestPickupEl  = document.getElementById("latestPickup");
  const timeStatEl      = document.getElementById("timeStat");
  const spendStatEl     = document.getElementById("spendStat");

  function getFilteredCards() {
    let list = CARDS.slice();
    if (activeFilter === "owned") list = list.filter(c => isOwned(c.num));
    else if (activeFilter === "missing") list = list.filter(c => !isOwned(c.num));
    else if (activeFilter !== "all") list = list.filter(c => c.rarity === activeFilter);

    if (activeSort === "recent" || activeSort === "oldest") {
      const ownedList   = list.filter(c =>  isOwned(c.num));
      const missingList = list.filter(c => !isOwned(c.num));
      ownedList.sort((a, b) => {
        const cmp = owned[a.num].localeCompare(owned[b.num]);
        return activeSort === "recent" ? -cmp : cmp;
      });
      missingList.sort((a, b) => a.num - b.num);
      return [...ownedList, ...missingList];
    }
    if (activeSort === "dex") {
      return list.sort((a, b) => {
        const aDex = a.dex != null ? a.dex : Infinity;
        const bDex = b.dex != null ? b.dex : Infinity;
        if (aDex !== bDex) return aDex - bDex;
        return a.num - b.num;
      });
    }
    return list.sort((a, b) => a.num - b.num);
  }

  function replaceCardInDom(num) {
    const cardEl = grid.querySelector(`[data-num="${num}"]`);
    if (cardEl) cardEl.replaceWith(buildCard(CARDS.find(c => c.num === num)));
  }

  function buildCard(card) {
    const isOwn = isOwned(card.num);
    const el = document.createElement("div");
    el.className = "card" + (isOwn ? " owned" : "");
    el.dataset.num = card.num;
    el.tabIndex = 0;
    el.setAttribute("role", "button");
    el.setAttribute("aria-pressed", String(isOwn));
    el.setAttribute("aria-label", `${card.name}, card #${card.num}, ${card.rarity}, ${isOwn ? "owned" : "missing"}`);

    const activeSet = SETS[activeSetId];
    const imgSrc = activeSet.imgBase
      ? `${activeSet.imgBase}/${card.num}.${activeSet.imgExt}`
      : `${activeSet.imgPath}/${pad(card.num)}.${activeSet.imgExt}`;
    const imgLoading = activeSet.imgBase ? "eager" : "lazy";
    const dateLabel = isOwn ? fmtDate(owned[card.num]) : "";
    const condValue = conditions[card.num] || "";
    const condDisplay = condValue || "+ condition";
    const priceValue = prices[card.num];
    const hasPrice = typeof priceValue === "number" && !isNaN(priceValue);
    const priceDisplay = hasPrice ? fmtIDR(priceValue) : "+ price";
    const priceClass = hasPrice ? "" : "unset";
    const editionValue = cardEditions[card.num] || "";
    const editionDisplay = editionValue ? editionLabel(activeSetId, editionValue) : "+ edition";
    const editionClass = editionValue ? "" : "unset";

    el.innerHTML = `
      <div class="card-image-wrap">
        <span class="num-badge">#${card.num}</span>
        <img src="${imgSrc}" alt="${escapeAttr(card.name)}" loading="${imgLoading}"
             onerror="this.outerHTML='<div class=&quot;placeholder&quot;><div class=&quot;ph-num&quot;>#${card.num}</div><div class=&quot;ph-label&quot;>no image</div></div>'">
        <div class="check-overlay" aria-hidden="true">✓</div>
      </div>
      <div class="card-info">
        <div class="card-name">${card.name}</div>
        <div class="card-meta">${card.rarity}${card.cardType !== "Pokemon" ? " · " + card.cardType : ""}</div>
        ${!isOwn ? `<div class="card-cta">+ Add to collection</div>` : ""}
        ${isOwn ? `<div class="card-date" title="Click to edit purchase date">${dateLabel}</div>` : ""}
        ${isOwn ? `<span class="card-edition ${editionClass}" title="Click to set edition">${escapeAttr(editionDisplay)}</span>` : ""}
        ${isOwn ? `<span class="card-condition ${condClass(condValue)}" title="Click to set condition">${escapeAttr(condDisplay)}</span>` : ""}
        ${isOwn ? `<span class="card-price ${priceClass}" title="Click to set price">${escapeAttr(priceDisplay)}</span>` : ""}
      </div>
    `;

    el.addEventListener("click", (e) => {
      if (e.target.closest(".card-date")) return;
      if (e.target.closest(".card-edition")) return;
      if (e.target.closest(".card-condition")) return;
      if (e.target.closest(".card-price")) return;
      toggle(card.num);
    });
    el.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(card.num); }
    });

    // Date editor
    const dateEl = el.querySelector(".card-date");
    if (dateEl) {
      dateEl.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const wrap = document.createElement("div");
        wrap.className = "card-date";
        const input = document.createElement("input");
        input.type = "date";
        input.value = owned[card.num] || todayISO();
        input.max = todayISO();
        wrap.appendChild(input);
        dateEl.replaceWith(wrap);
        input.focus();
        try { input.showPicker && input.showPicker(); } catch (_) {}

        let committed = false;
        const commit = () => {
          if (committed) return;
          committed = true;
          if (input.value && input.value !== owned[card.num]) {
            setDate(card.num, input.value);
          } else {
            const reset = document.createElement("div");
            reset.className = "card-date";
            reset.title = "Click to edit purchase date";
            reset.textContent = fmtDate(owned[card.num]);
            wrap.replaceWith(reset);
            reset.addEventListener("click", (e) => { e.stopPropagation(); dateEl.click(); });
          }
        };
        input.addEventListener("change", commit);
        input.addEventListener("blur", commit);
        input.addEventListener("click", (e) => e.stopPropagation());
        input.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "Escape") { committed = true; input.blur(); }
        });
      });
    }

    // Edition editor
    const editionEl = el.querySelector(".card-edition");
    if (editionEl) {
      editionEl.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const wrap = document.createElement("span");
        wrap.className = "card-edition";
        const select = document.createElement("select");
        const current = cardEditions[card.num] || "";

        const blank = document.createElement("option");
        blank.value = ""; blank.textContent = "— unspecified —";
        select.appendChild(blank);

        for (const ed of SETS[activeSetId].editions) {
          const opt = document.createElement("option");
          opt.value = ed.key; opt.textContent = ed.label;
          select.appendChild(opt);
        }

        select.value = current;
        wrap.appendChild(select);
        editionEl.replaceWith(wrap);
        select.focus();
        try { select.showPicker && select.showPicker(); } catch (_) {}

        let committed = false;
        const commit = () => {
          if (committed) return;
          committed = true;
          if (select.value !== current) setCardEdition(card.num, select.value);
          else replaceCardInDom(card.num);
        };
        select.addEventListener("change", commit);
        select.addEventListener("blur", commit);
        select.addEventListener("click", (e) => e.stopPropagation());
        select.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "Escape") { committed = true; replaceCardInDom(card.num); }
        });
      });
    }

    // Condition editor
    const condEl = el.querySelector(".card-condition");
    if (condEl) {
      condEl.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const wrap = document.createElement("span");
        wrap.className = "card-condition";
        const select = document.createElement("select");
        const current = conditions[card.num] || "";

        const blank = document.createElement("option");
        blank.value = ""; blank.textContent = "— unspecified —";
        select.appendChild(blank);

        const rawGroup = document.createElement("optgroup");
        rawGroup.label = "Raw / Ungraded";
        for (const c of RAW_CONDS) {
          const opt = document.createElement("option");
          opt.value = c; opt.textContent = c;
          rawGroup.appendChild(opt);
        }
        select.appendChild(rawGroup);

        const gradedGroup = document.createElement("optgroup");
        gradedGroup.label = "Graded";
        for (const c of GRADED_CONDS) {
          const opt = document.createElement("option");
          opt.value = c; opt.textContent = c;
          gradedGroup.appendChild(opt);
        }
        select.appendChild(gradedGroup);

        select.value = current;
        wrap.appendChild(select);
        condEl.replaceWith(wrap);
        select.focus();
        try { select.showPicker && select.showPicker(); } catch (_) {}

        let committed = false;
        const commit = () => {
          if (committed) return;
          committed = true;
          if (select.value !== current) setCondition(card.num, select.value);
          else replaceCardInDom(card.num);
        };
        select.addEventListener("change", commit);
        select.addEventListener("blur", commit);
        select.addEventListener("click", (e) => e.stopPropagation());
        select.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "Escape") { committed = true; replaceCardInDom(card.num); }
        });
      });
    }

    // Price editor
    const priceEl = el.querySelector(".card-price");
    if (priceEl) {
      priceEl.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const wrap = document.createElement("span");
        wrap.className = "card-price";
        const input = document.createElement("input");
        input.type = "number"; input.min = "0"; input.step = "1";
        input.placeholder = "0"; input.inputMode = "numeric";
        const current = typeof prices[card.num] === "number" ? prices[card.num] : "";
        input.value = current;
        wrap.appendChild(input);
        priceEl.replaceWith(wrap);
        input.focus(); input.select();

        let committed = false;
        const commit = () => {
          if (committed) return;
          committed = true;
          const v = input.value.trim();
          if (v === "") setPrice(card.num, null);
          else {
            const n = Number(v);
            if (!isNaN(n) && n >= 0) setPrice(card.num, n);
            else replaceCardInDom(card.num);
          }
        };
        input.addEventListener("change", commit);
        input.addEventListener("blur", commit);
        input.addEventListener("click", (e) => e.stopPropagation());
        input.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "Enter") { e.preventDefault(); commit(); }
          else if (e.key === "Escape") { committed = true; replaceCardInDom(card.num); }
        });
      });
    }

    return el;
  }

  function render() {
    grid.innerHTML = "";
    const list = getFilteredCards();
    if (list.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = activeFilter === "owned"
        ? "No cards collected yet — start checking some off!"
        : "No cards match this filter.";
      grid.appendChild(empty);
      return;
    }
    const frag = document.createDocumentFragment();
    list.forEach(c => frag.appendChild(buildCard(c)));
    grid.appendChild(frag);
  }

  // ─── EVENTS ───────────────────────────────────────────────────────────────────

  filtersEl.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    activeFilter = btn.dataset.filter;
    filtersEl.querySelectorAll(".filter-btn").forEach(b =>
      b.classList.toggle("active", b === btn)
    );
    render();
  });

  sortSelect.addEventListener("change", () => {
    activeSort = sortSelect.value;
    render();
  });

  // ─── INIT ─────────────────────────────────────────────────────────────────────

  // Sync set title/tab to saved activeSetId on load
  const s = SETS[activeSetId];
  document.getElementById("setTitle").textContent = s.name;
  document.getElementById("setSubtitle").textContent = `Crystamber · Pokemon TCG Collection Tracker · ${s.cards.length} cards`;
  document.getElementById("totalCount").textContent = s.cards.length;
  document.querySelectorAll(".set-tab").forEach(b =>
    b.classList.toggle("active", b.dataset.set === activeSetId)
  );

  updateProgress();
  render();

  // Pull every set for this collection, then adopt only the rows the cloud has
  // actually moved past. rev is server-managed, so "cloud rev higher than the
  // highest rev this device has seen" is the one trustworthy signal that another
  // device wrote something. Because rev also increments on a clear, deleting a
  // card now propagates — the old hasData guard silently made that impossible.
  // Genuine simultaneous edits are last-write-wins, correct for a single user.
  async function initialLoad() {
    if (!sb) { refreshStatus(); return; }
    refreshStatus();
    try {
      const { data: rows, error } = await sb
        .from('collection_sets')
        .select('set_id, owned, conditions, prices, card_editions, rev')
        .eq('collection_id', COLLECTION_ID);
      if (error) throw error;

      const seen = localRevs();
      const inCloud = new Set();

      for (const row of (rows || [])) {
        const id = row.set_id;
        if (!SETS[id]) continue;
        inCloud.add(id);

        // This device holds unsent edits for the set. It used to skip the cloud
        // row outright and later upsert its own payload over the top, which is
        // silent data loss the moment the other device also edited while the
        // backend was down: whoever flushed second erased the other completely.
        // An outage guarantees that case rather than making it unlikely.
        //
        // rev settles it. If the cloud has not moved past what this device has
        // seen, nothing was lost and the local copy is simply newer. If it has
        // moved, another device wrote while we were away, so union the two the
        // same way first contact does and push the merged result up. The set
        // stays queued in both branches.
        if (pendingSets.has(id)) {
          if (row.rev > (seen[id] || 0)) {
            writeSetLocal(id, unionMerge(setPayload(id), row));
            setLocalRev(id, row.rev);
            if (id === activeSetId) loadSetState(id);
          }
          continue;
        }

        // First contact: this set has no recorded rev, so this device has never
        // synced under the per-set scheme and may hold work the cloud never got.
        // rev cannot see that, so union the two sides instead of letting either
        // win. This is what makes it safe to open the app on a device whose
        // edits were stranded by an outage.
        if (!(id in seen)) {
          const local = setPayload(id);
          if (payloadHasData(local)) {
            writeSetLocal(id, unionMerge(local, row));
            setLocalRev(id, row.rev);
            pendingSets.add(id);              // send the union back up
            if (id === activeSetId) loadSetState(id);
            continue;
          }
        }

        if (row.rev <= (seen[id] || 0)) continue;
        writeSetLocal(id, row);
        setLocalRev(id, row.rev);
        if (id === activeSetId) loadSetState(id);
      }

      cloudReady = true;
      syncError = null;
      backoff = 1000;

      // Sets this device holds that the cloud has never seen get seeded upward.
      for (const id in SETS) {
        if (inCloud.has(id)) continue;
        if (payloadHasData(setPayload(id))) pendingSets.add(id);
      }
      if (pendingSets.size) scheduleFlush(0);

      updateProgress();
      render();
      refreshStatus();
    } catch (err) {
      // Reads retry as well, otherwise a page opened offline never syncs at all.
      syncError = err;
      refreshStatus();
      backoff = Math.min(backoff * 2, 30000);
      setTimeout(initialLoad, backoff);
    }
  }

  initialLoad();
</script>
</body>
</html>
