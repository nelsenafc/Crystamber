# Supabase free tier pauses a project after 7 days with no API activity, which
# tears down the project subdomain entirely - the app then fails every read and
# write until someone restores it by hand. A collection tracker opened every few
# weeks trips that timer as a matter of course, so this pings the REST endpoint
# on a schedule to keep the project marked active.
#
# The key below is the publishable [anon] key already inlined in the public
# index.html, and RLS scopes it to collection_id = 'crystamber'. Nothing is
# exposed here that the deployed page does not already hand to every visitor.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 3 */3 * *'   # every 3 days, well inside the 7 day pause window
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: https://guyrhkzmogqcnemwyilx.supabase.co
          SUPABASE_KEY: sb_publishable_vwBr1SsV84I964WDAetFzA_Ow4p6e2L
        run: |
          set -u
          code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/collection_sets?collection_id=eq.crystamber&select=set_id,rev&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" || echo 000)
          echo "HTTP $code"
          cat /tmp/out || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not answer with 200. The project is probably paused - restore it at https://supabase.com/dashboard/project/guyrhkzmogqcnemwyilx"
            exit 1
          fi
          echo "Project is awake."
