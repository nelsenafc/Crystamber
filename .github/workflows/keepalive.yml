# Supabase free tier pauses a project after 7 days with no API activity, which
# tears down the project subdomain entirely - the app then fails every read and
# write until someone restores it by hand. A collection tracker opened every few
# weeks trips that timer as a matter of course, so this keeps the project
# marked active.
#
# It used to read collection_sets every three days, and the project paused
# anyway [~4 Oct 2026, three days after a successful read]. So it now WRITES:
# the keepalive_ping() RPC bumps a timestamp in its own one-row table
# [migration 20261011_keepalive_write.sql], once a day.
#
# The key below is the publishable [anon] key already inlined in the public
# index.html. It can call keepalive_ping() and nothing else in that table.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 3 * * *'     # daily; GitHub often runs it hours late, which is fine
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a keepalive ping
        env:
          SUPABASE_URL: https://guyrhkzmogqcnemwyilx.supabase.co
          SUPABASE_KEY: sb_publishable_vwBr1SsV84I964WDAetFzA_Ow4p6e2L
        run: |
          set -u
          code=$(curl -s -o /tmp/out -w '%{http_code}' --max-time 30 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}' || echo 000)
          echo "HTTP $code"
          cat /tmp/out || true
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Supabase did not answer with 200. The project is probably paused - restore it at https://supabase.com/dashboard/project/guyrhkzmogqcnemwyilx"
            exit 1
          fi
          echo "Project is awake."
